# The Xcode project of the iOS app, generated by XcodeGen (`xcodegen generate`), so
# that it can be built without a Mac at hand: GitHub Actions does it (ci.yml,
# ios-release.yml).
name: MailZen
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
packages:
  MailZenKit:
    path: MailZenKit
targets:
  MailZen:
    type: application
    platform: iOS
    sources:
      - path: MailZen
    dependencies:
      - package: MailZenKit
      - target: MailZenShare
    entitlements:
      path: MailZen/MailZen.entitlements
      properties:
        com.apple.security.application-groups: [group.com.maxlestage.mailzen]
    info:
      path: MailZen/Info.plist
      properties:
        CFBundleDisplayName: MailZen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fr, en, es]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: "L’appareil photo sert à scanner les QR codes : la destination s’affiche avant toute ouverture."
        NSPhotoLibraryUsageDescription: "MailZen lit les captures que vous choisissez pour y trouver du texte et des QR codes, sur l’appareil."
        BGTaskSchedulerPermittedIdentifiers: [com.maxlestage.mailzen.refresh]
        UIBackgroundModes: [fetch]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Email
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.mail.email, public.email-message]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.mailzen
        PRODUCT_NAME: MailZen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MailZenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MailZenShare
      - path: MailZen/Shared
    dependencies:
      - package: MailZenKit
    entitlements:
      path: MailZenShare/MailZenShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.maxlestage.mailzen]
    info:
      path: MailZenShare/Info.plist
      properties:
        CFBundleDisplayName: MailZen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.mailzen.share
        PRODUCT_NAME: MailZenShare
schemes:
  MailZen:
    build:
      targets:
        MailZen: all
    run:
      config: Debug
    archive:
      config: Release
