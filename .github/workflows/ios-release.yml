# Builds the iOS app bundle, and signs and sends it to TestFlight, without a Mac:
# everything runs on a GitHub macOS runner with an App Store Connect API key. Then install
# TestFlight on the iPhone to try each version.
#
# - `bundle`: always, the app bundle built for iPhone, unsigned (MailZen-unsigned.ipa),
#   kept as an artifact of the run.
# - `testflight`: with the secrets below, registers the bundle IDs and their App Groups
#   capability with the App Store Connect API (scripts/asc.py), archives, signs and
#   uploads to TestFlight. If the app does not exist in App Store Connect yet, the signed
#   .ipa is kept as an artifact and a notice says what to create.
#
# Setup (once, from a phone):
#   1. An Apple Developer account (developer.apple.com, paid membership).
#   2. App Store Connect → Apps → + → New app, platform iOS, bundle ID
#      com.maxlestage.mailzen (the workflow registers the bundle IDs itself on its first
#      run with the key: run it once, then pick the bundle ID in the list).
#   3. App Store Connect → Users and Access → Integrations → App Store Connect API →
#      generate a key with the "App Manager" role; download the .p8 file.
#   4. GitHub → Settings → Secrets and variables → Actions:
#      - secret ASC_KEY_ID          the key ID
#      - secret ASC_ISSUER_ID       the issuer ID shown above the keys
#      - secret ASC_KEY_P8          the content of the .p8 file
#      - secret APPLE_TEAM_ID       optional: the team ID (developer.apple.com →
#                                   Membership); read from Apple when missing
#   5. If the first archive complains about the App Group: developer.apple.com →
#      Identifiers → App Groups → + → group.com.maxlestage.mailzen (shared by the app
#      and its share extension, for the senders and corrections the user teaches it).
# Without them, the workflow stops with a notice.

name: iOS to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/ios/**"

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  bundle:
    name: App bundle (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the app bundle for iPhone
        run: |
          set -euo pipefail
          brew install xcodegen
          cd apps/ios
          xcodegen generate
          xcodebuild build -project MailZen.xcodeproj -scheme MailZen -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/MailZen.app"
          test -d "$app/PlugIns/MailZenShare.appex"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/MailZen-unsigned.ipa" Payload)
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          {
            echo "### 📦 MailZen $version (${{ github.run_number }}) — app bundle"
            echo "MailZen.app with its share extension, built for iPhone, unsigned: \`MailZen-unsigned.ipa\` in the artifacts of this run ($(du -h MailZen-unsigned.ipa | cut -f1))."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: MailZen-${{ github.run_number }}-unsigned
          path: MailZen-unsigned.ipa
          retention-days: 30

  testflight:
    name: Sign and upload to TestFlight
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Configuration
        id: config
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::TestFlight is not configured: add the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (see ios-release.yml). The unsigned app bundle is built anyway."
            echo "### ⏸️ TestFlight not configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 in GitHub → Settings → Secrets and variables → Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - name: Register the bundle IDs and App Groups
        id: asc
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "pyjwt[crypto]"
          "$RUNNER_TEMP/venv/bin/python" apps/ios/scripts/asc.py
      - name: Archive and sign
        if: steps.config.outputs.ready == 'true'
        env:
          TEAM: ${{ steps.asc.outputs.team_id }}
          APP_GROUP_READY: ${{ vars.APP_GROUP_READY }}
        run: |
          set -euo pipefail
          brew install xcodegen
          cd apps/ios
          if [ "$APP_GROUP_READY" != "true" ]; then
            # The App Group cannot be created through the API: without it, sign without the
            # shared container (the app and the share extension then keep their own lists).
            python3 - <<'PY'
          import re
          p = "project.yml"
          s = open(p).read()
          s = re.sub(r"\n    entitlements:\n      path: [^\n]+\n      properties:\n        com\.apple\.security\.application-groups: \[[^\]]*\]", "", s)
          open(p, "w").write(s)
          PY
            echo "::notice::Signed without the App Group: create group.com.maxlestage.mailzen in developer.apple.com (Identifiers → App Groups), add it to both bundle IDs, then set the repository variable APP_GROUP_READY to true."
          fi
          xcodegen generate
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          echo "AUTH_KEY=$key" >> "$GITHUB_ENV"
          xcodebuild archive -project MailZen.xcodeproj -scheme MailZen \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MailZen.xcarchive" \
            -skipPackagePluginValidation -allowProvisioningUpdates \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
      - name: Upload to TestFlight
        if: steps.config.outputs.ready == 'true' && steps.asc.outputs.app_exists == 'true'
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MailZen.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### 📲 MailZen ${{ github.run_number }} sent to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "It appears in TestFlight on the iPhone once Apple has processed it (a few minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Export the signed app (no App Store Connect app yet)
        if: steps.config.outputs.ready == 'true' && steps.asc.outputs.app_exists != 'true'
        run: |
          set -euo pipefail
          cd apps/ios
          /usr/libexec/PlistBuddy -c "Set :destination export" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MailZen.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/MailZen-signed.ipa"
          echo "### 📦 Signed app ready, TestFlight waiting for the app" >> "$GITHUB_STEP_SUMMARY"
          echo "Create the app once in App Store Connect (Apps → + → New app, bundle ID com.maxlestage.mailzen), then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.config.outputs.ready == 'true' && steps.asc.outputs.app_exists != 'true'
        with:
          name: MailZen-${{ github.run_number }}-signed
          path: MailZen-signed.ipa
          retention-days: 30
