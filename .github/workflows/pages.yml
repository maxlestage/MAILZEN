# Publishes the site on GitHub Pages: the Paquets server renders every page in the
# three languages, then writes them as static files (`cargo run -- export dist`), with
# the WebAssembly bundle, the PWA (manifest, service worker, icons) and the sitemap.
#
# One-time setup, from a phone too: GitHub → the repository → Settings → Pages →
# Build and deployment → Source: "GitHub Actions".

name: Deploy to GitHub Pages

# Started after every merge into master by ci.yml, by a direct push to master, and by
# hand: Actions → Deploy to GitHub Pages → Run workflow (GitHub app included).
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - id: pages
        uses: actions/configure-pages@v6
      - name: Islands and animations (WebAssembly)
        run: ./build-wasm.sh
      - name: Export every page
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: cargo run --release -- export dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
